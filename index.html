<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#020812">
<title>JARVIS AI Demo</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    min-height:100vh;
    background:
    radial-gradient(circle at 50% 15%,#123d58,#06121d 40%,#010509 100%);
    color:white;
    font-family:Arial,sans-serif;
}

.app{
    max-width:520px;
    min-height:100vh;
    margin:auto;
    padding:18px;
    display:flex;
    flex-direction:column;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:29px;
    font-weight:bold;
    letter-spacing:5px;
    text-shadow:0 0 15px #00eaff;
}

.status{
    color:#00eaff;
    font-size:11px;
}

.dot{
    display:inline-block;
    width:7px;
    height:7px;
    background:#00eaff;
    border-radius:50%;
    box-shadow:0 0 12px #00eaff;
}

.core-area{
    height:235px;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

.ring{
    width:200px;
    height:200px;
    border-radius:50%;
    border:2px solid rgba(0,234,255,.35);
    box-shadow:
    0 0 30px rgba(0,234,255,.25),
    inset 0 0 30px rgba(0,234,255,.12);
    animation:spin 12s linear infinite;
}

.ring:before{
    content:"";
    position:absolute;
    width:150px;
    height:150px;
    margin:23px;
    border-radius:50%;
    border:1px solid rgba(0,234,255,.35);
}

.ring:after{
    content:"";
    position:absolute;
    width:95px;
    height:95px;
    margin:51px;
    border-radius:50%;
    border:1px solid rgba(0,234,255,.4);
}

.core{
    position:absolute;
    width:70px;
    height:70px;
    border-radius:50%;
    background:radial-gradient(circle,#fff,#65edff 20%,#007c9e 55%,#00151e);
    box-shadow:0 0 20px #00eaff,0 0 60px rgba(0,234,255,.6);
    animation:pulse 1.5s infinite;
}

.listening .core{
    animation:listening .45s infinite alternate;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

@keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.1)}
}

@keyframes listening{
    to{transform:scale(1.25)}
}

.chat{
    flex:1;
    max-height:35vh;
    overflow-y:auto;
    margin-bottom:12px;
}

.message{
    max-width:90%;
    padding:13px 15px;
    margin-bottom:10px;
    border-radius:16px;
    line-height:1.5;
    font-size:14px;
    white-space:pre-wrap;
}

.jarvis{
    background:rgba(8,40,60,.85);
    border:1px solid rgba(0,234,255,.2);
}

.user{
    margin-left:auto;
    background:rgba(0,130,170,.3);
    border:1px solid rgba(0,234,255,.2);
}

.input-area{
    display:flex;
    gap:7px;
    padding:7px;
    border-radius:17px;
    background:rgba(3,15,25,.95);
    border:1px solid rgba(0,234,255,.25);
}

input{
    flex:1;
    min-width:0;
    background:transparent;
    border:0;
    outline:0;
    color:white;
    padding:10px;
    font-size:15px;
}

input::placeholder{
    color:#66808e;
}

.send{
    width:45px;
    height:45px;
    border:0;
    border-radius:13px;
    background:#00bfd8;
    font-size:20px;
}

.mic{
    width:65px;
    height:65px;
    margin:14px auto;
    border-radius:50%;
    border:2px solid rgba(0,234,255,.5);
    background:radial-gradient(circle,#145e73,#062d3b);
    color:white;
    font-size:25px;
    box-shadow:0 0 25px rgba(0,234,255,.3);
}

.section-title{
    color:#688696;
    font-size:11px;
    letter-spacing:1px;
    margin-bottom:8px;
}

.quick{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.quick button{
    min-height:47px;
    padding:7px 3px;
    border-radius:12px;
    border:1px solid rgba(0,234,255,.15);
    background:rgba(8,35,50,.85);
    color:#b9eff8;
    font-size:11px;
}

.quick button:active{
    transform:scale(.96);
    background:rgba(0,180,220,.3);
}

.footer{
    text-align:center;
    color:#466170;
    font-size:10px;
    margin-top:14px;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
    <div class="logo">JARVIS</div>
    <div class="status">
        <span class="dot"></span> DEMO ONLINE
    </div>
</div>

<div class="core-area" id="coreArea">
    <div class="ring"></div>
