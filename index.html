<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#020812">
<title>JARVIS AI Demo</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    min-height:100vh;
    background:
    radial-gradient(circle at 50% 15%,#123d58,#06121d 40%,#010509 100%);
    color:white;
    font-family:Arial,sans-serif;
}

.app{
    max-width:520px;
    min-height:100vh;
    margin:auto;
    padding:18px;
    display:flex;
    flex-direction:column;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:29px;
    font-weight:bold;
    letter-spacing:5px;
    text-shadow:0 0 15px #00eaff;
}

.status{
    color:#00eaff;
    font-size:11px;
}

.dot{
    display:inline-block;
    width:7px;
    height:7px;
    background:#00eaff;
    border-radius:50%;
    box-shadow:0 0 12px #00eaff;
}

.core-area{
    height:235px;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

.ring{
    width:200px;
    height:200px;
    border-radius:50%;
    border:2px solid rgba(0,234,255,.35);
    box-shadow:
    0 0 30px rgba(0,234,255,.25),
    inset 0 0 30px rgba(0,234,255,.12);
    animation:spin 12s linear infinite;
}

.ring:before{
    content:"";
    position:absolute;
    width:150px;
    height:150px;
    margin:23px;
    border-radius:50%;
    border:1px solid rgba(0,234,255,.35);
}

.ring:after{
    content:"";
    position:absolute;
    width:95px;
    height:95px;
    margin:51px;
    border-radius:50%;
    border:1px solid rgba(0,234,255,.4);
}

.core{
    position:absolute;
    width:70px;
    height:70px;
    border-radius:50%;
    background:radial-gradient(circle,#fff,#65edff 20%,#007c9e 55%,#00151e);
    box-shadow:0 0 20px #00eaff,0 0 60px rgba(0,234,255,.6);
    animation:pulse 1.5s infinite;
}

.listening .core{
    animation:listening .45s infinite alternate;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

@keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.1)}
}

@keyframes listening{
    to{transform:scale(1.25)}
}

.chat{
    flex:1;
    max-height:35vh;
    overflow-y:auto;
    margin-bottom:12px;
}

.message{
    max-width:90%;
    padding:13px 15px;
    margin-bottom:10px;
    border-radius:16px;
    line-height:1.5;
    font-size:14px;
    white-space:pre-wrap;
}

.jarvis{
    background:rgba(8,40,60,.85);
    border:1px solid rgba(0,234,255,.2);
}

.user{
    margin-left:auto;
    background:rgba(0,130,170,.3);
    border:1px solid rgba(0,234,255,.2);
}

.input-area{
    display:flex;
    gap:7px;
    padding:7px;
    border-radius:17px;
    background:rgba(3,15,25,.95);
    border:1px solid rgba(0,234,255,.25);
}

input{
    flex:1;
    min-width:0;
    background:transparent;
    border:0;
    outline:0;
    color:white;
    padding:10px;
    font-size:15px;
}

input::placeholder{
    color:#66808e;
}

.send{
    width:45px;
    height:45px;
    border:0;
    border-radius:13px;
    background:#00bfd8;
    font-size:20px;
}

.mic{
    width:65px;
    height:65px;
    margin:14px auto;
    border-radius:50%;
    border:2px solid rgba(0,234,255,.5);
    background:radial-gradient(circle,#145e73,#062d3b);
    color:white;
    font-size:25px;
    box-shadow:0 0 25px rgba(0,234,255,.3);
}

.section-title{
    color:#688696;
    font-size:11px;
    letter-spacing:1px;
    margin-bottom:8px;
}

.quick{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.quick button{
    min-height:47px;
    padding:7px 3px;
    border-radius:12px;
    border:1px solid rgba(0,234,255,.15);
    background:rgba(8,35,50,.85);
    color:#b9eff8;
    font-size:11px;
}

.quick button:active{
    transform:scale(.96);
    background:rgba(0,180,220,.3);
}

.footer{
    text-align:center;
    color:#466170;
    font-size:10px;
    margin-top:14px;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
    <div class="logo">JARVIS</div>
    <div class="status">
        <span class="dot"></span> DEMO ONLINE
    </div>
</div>

<div class="core-area" id="coreArea">
    <div class="ring"></div>
        <div class="core"></div>
</div>

<div class="chat" id="chat">

    <div class="message jarvis">
        Hello. I am JARVIS.

        This is my demonstration mode.

        Try saying:
        "Search Google for artificial intelligence"
        or
        "Open YouTube".
    </div>

</div>

<div class="input-area">

    <input
        id="input"
        type="text"
        placeholder="Ask or command JARVIS..."
        autocomplete="off">

    <button
        class="send"
        onclick="sendMessage()">
        ➤
    </button>

</div>

<button
    class="mic"
    id="mic"
    onclick="startVoice()">
    🎙️
</button>

<div class="section-title">
    QUICK COMMANDS
</div>

<div class="quick">

    <button onclick="command('open YouTube')">
        ▶️ YouTube
    </button>

    <button onclick="command('search Google for artificial intelligence')">
        🔎 Google
    </button>

    <button onclick="command('open Amazon')">
        🛒 Amazon
    </button>

    <button onclick="command('open Flipkart')">
        🛍️ Flipkart
    </button>

    <button onclick="command('open WhatsApp')">
        💬 WhatsApp
    </button>

    <button onclick="command('open Instagram')">
        📸 Instagram
    </button>

    <button onclick="command('open Spotify')">
        🎵 Spotify
    </button>

    <button onclick="command('open Gmail')">
        📧 Gmail
    </button>

    <button onclick="command('open Maps')">
        🗺️ Maps
    </button>

    <button onclick="command('open GitHub')">
        💻 GitHub
    </button>

    <button onclick="command('open LinkedIn')">
        💼 LinkedIn
    </button>

    <button onclick="command('open Wikipedia')">
        📚 Wikipedia
    </button>

    <button onclick="command('what time is it')">
        🕐 Time
    </button>

    <button onclick="command('what is the date')">
        📅 Date
    </button>

    <button onclick="command('open calculator')">
        🧮 Calculator
    </button>

    <button onclick="command('open camera')">
        📷 Camera
    </button>

</div>

<div class="footer">
    JARVIS AI DEMO • Built with HTML, CSS & JavaScript
</div>

</div>

<script>

/* WEBSITE LINKS */

const sites = {

    youtube: "https://www.youtube.com/",
    google: "https://www.google.com/",
    amazon: "https://www.amazon.in/",
    flipkart: "https://www.flipkart.com/",
    whatsapp: "https://web.whatsapp.com/",
    instagram: "https://www.instagram.com/",
    spotify: "https://open.spotify.com/",
    gmail: "https://mail.google.com/",
    maps: "https://maps.google.com/",
    github: "https://github.com/",
    linkedin: "https://www.linkedin.com/",
    wikipedia: "https://www.wikipedia.org/",
    reddit: "https://www.reddit.com/",
    netflix: "https://www.netflix.com/",
    myntra: "https://www.myntra.com/",
    meesho: "https://www.meesho.com/",
    chatgpt: "https://chatgpt.com/",
    drive: "https://drive.google.com/",
    translate: "https://translate.google.com/"

};


/* CHAT */

function addMessage(text, type) {

    const chat =
        document.getElementById("chat");

    const div =
        document.createElement("div");

    div.className =
        "message " + type;

    div.textContent =
        text;

    chat.appendChild(div);

    chat.scrollTop =
        chat.scrollHeight;
}


/* VOICE OUTPUT */

function speak(text) {

    if (!window.speechSynthesis)
        return;

    speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.lang = "en-IN";
    speech.rate = 0.95;
    speech.pitch = 1;

    speechSynthesis.speak(speech);
}


function reply(text) {

    addMessage(text, "jarvis");

    speak(text);
}


/* VOICE INPUT */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.lang = "en-IN";

    recognition.continuous = false;

    recognition.interimResults = false;


    recognition.onstart = function () {

        document
            .getElementById("coreArea")
            .classList.add("listening");

        document
            .getElementById("mic")
            .textContent = "🔴";
    };


    recognition.onend = function () {

        document
            .getElementById("coreArea")
            .classList.remove("listening");

        document
            .getElementById("mic")
            .textContent = "🎙️";
    };


    recognition.onresult = function (event) {

        const text =
            event.results[0][0].transcript;

        document
            .getElementById("input")
            .value = text;

        command(text);
    };


    recognition.onerror = function () {

        reply(
            "Sorry, I couldn't hear you."
        );
    };

}


function startVoice() {

    if (!recognition) {

        reply(
            "Voice recognition is not supported in this browser. Try Chrome on Android."
        );

        return;
    }

    try {

        recognition.start();

    } catch (e) {

        console.log(e);

    }
}


/* TEXT INPUT */

function sendMessage() {

    const input =
        document.getElementById("input");

    const text =
        input.value.trim();

    if (!text)
        return;

    input.value = "";

    command(text);
}


document
    .getElementById("input")
    .addEventListener(
        "keydown",
        function (e) {

            if (e.key === "Enter") {
                sendMessage();
            }

        }
    );


/* MAIN COMMAND ENGINE */

function command(text) {

    addMessage(text, "user");

    const lower =
        text.toLowerCase().trim();


    /* OPEN WEBSITES */

    for (const site in sites) {

        if (
            lower === site ||
            lower.includes("open " + site) ||
            lower.includes("launch " + site) ||
            lower.includes("go to " + site)
        ) {

            reply(
                "Opening " + site + "."
            );

            setTimeout(function () {

                window.location.href =
                    sites[site];

            }, 500);

            return;
        }
    }


    /* GOOGLE SEARCH */

    if (
        lower.includes("search google for") ||
        lower.startsWith("google ")
    ) {

        let query =
            lower
                .replace(
                    "search google for",
                    ""
                )
                .replace(
                    "google",
                    ""
                )
                .trim();

        if (!query) {

            reply(
                "What should I search for?"
            );

            return;
        }

        reply(
            "Searching Google for " +
            query + "."
        );

        setTimeout(function () {

            window.location.href =
                "https://www.google.com/search?q=" +
                encodeURIComponent(query);

        }, 700);

        return;
    }


    /* GENERAL SEARCH */

    if (lower.startsWith("search ")) {

        let query =
            lower
                .replace("search", "")
                .trim();

        reply(
            "Searching Google for " +
            query + "."
        );

        setTimeout(function () {

            window.location.href =
                "https://www.google.com/search?q=" +
                encodeURIComponent(query);

        }, 700);

        return;
    }


    /* YOUTUBE SEARCH */

    if (
        lower.startsWith("play ") ||
        lower.includes("search youtube for")
    ) {

        let query =
            lower
                .replace(
                    "search youtube for",
                    ""
                )
                .replace(
                    "play",
                    ""
                )
                .trim();

        if (!query) {

            reply(
                "What should I search for on YouTube?"
            );

            return;
        }

        reply(
            "Searching YouTube for " +
            query + "."
        );

        setTimeout(function () {

            window.location.href =
                "https://www.youtube.com/results?search_query=" +
                encodeURIComponent(query);

        }, 700);

        return;
    }


    /* TIME */

    if (
        lower.includes("what time") ||
        lower === "time"
    ) {

        const time =
            new Date().toLocaleTimeString(
                "en-IN",
                {
                    hour: "numeric",
                    minute: "2-digit"
                }
            );

        reply(
            "The time is " +
            time + "."
        );

        return;
    }


    /* DATE */

    if (
        lower.includes("what date") ||
        lower.includes("today's date") ||
        lower === "date"
    ) {

        const date =
            new Date().toLocaleDateString(
                "en-IN",
                {
                    weekday: "long",
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                }
            );

        reply(
            "Today is " +
            date + "."
        );

        return;
    }


    /* CALCULATOR */

    if (
        lower.includes("open calculator") ||
        lower === "calculator"
    ) {

        reply(
            "Opening the calculator."
        );

        setTimeout(function () {

            window.location.href =
                "https://www.google.com/search?q=calculator";

        }, 500);

        return;
    }


    /* CAMERA */

    if (lower.includes("open camera")) {

        reply(
            "Trying to open the camera."
        );

        window.location.href =
            "intent:#Intent;" +
            "action=android.media.action.IMAGE_CAPTURE;" +
            "end";

        return;
    }


    /* PHONE */

    if (lower.includes("open phone")) {

        reply(
            "Opening the phone application."
        );

        window.location.href =
            "tel:";

        return;
    }


    /* HELP */

    if (
        lower === "help" ||
        lower.includes("what can you do")
    ) {

        reply(
`I can currently:

• Search Google
• Search YouTube
• Open websites
• Open calculator
• Try to open camera
• Try to open phone
• Tell the time
• Tell the date
• Listen to your voice
• Speak my responses

Try saying:
"Search Google for artificial intelligence"`
        );

        return;
    }


    /* GREETING */

    if (
        lower === "hello" ||
        lower === "hi" ||
        lower.includes("hello jarvis")
    ) {

        reply(
            "Hello. JARVIS demonstration mode is online. How can I help?"
        );

        return;
    }


    /* UNKNOWN COMMAND */

    reply(
        "I don't have that capability in this demonstration yet. Try saying search Google for followed by your question."
    );

}

</script>

</body>
</html>
