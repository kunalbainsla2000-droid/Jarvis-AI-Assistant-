<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<meta name="theme-color" content="#020812">

<title>JARVIS AI</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(
            circle at 50% 20%,
            #103b5a,
            #06121f 40%,
            #01050a 100%
        );

    color: white;
    font-family: Arial, sans-serif;
}

.app {
    max-width: 520px;
    min-height: 100vh;
    margin: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
}


/* HEADER */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 5px;
}

.online {
    font-size: 11px;
    color: #00eaff;
}

.dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    background: #00eaff;
    border-radius: 50%;
    margin-right: 5px;
    box-shadow: 0 0 12px #00eaff;
}


/* JARVIS CORE */

.core-area {
    height: 250px;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;
}

.ring {
    width: 210px;
    height: 210px;

    border-radius: 50%;

    border: 2px solid rgba(0, 234, 255, .35);

    box-shadow:
        0 0 25px rgba(0, 234, 255, .3),
        inset 0 0 30px rgba(0, 234, 255, .15);

    animation: rotate 12s linear infinite;
}

.ring::before {
    content: "";

    position: absolute;

    width: 160px;
    height: 160px;

    margin: 23px;

    border-radius: 50%;

    border: 1px solid rgba(0, 234, 255, .3);
}

.ring::after {
    content: "";

    position: absolute;

    width: 105px;
    height: 105px;

    margin: 50px;

    border-radius: 50%;

    border: 1px solid rgba(0, 234, 255, .3);
}

.core {
    position: absolute;

    width: 75px;
    height: 75px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            white,
            #66edff 20%,
            #007c9d 50%,
            #00151e 75%
        );

    box-shadow:
        0 0 20px #00eaff,
        0 0 60px rgba(0, 234, 255, .6);

    animation: pulse 1.5s infinite;
}

@keyframes rotate {
    100% {
        transform: rotate(360deg);
    }
}

@keyframes pulse {

    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.1);
    }
}


/* CHAT */

.chat {
    flex: 1;
    overflow-y: auto;
    margin-bottom: 15px;
}

.message {
    padding: 13px 15px;

    margin-bottom: 10px;

    border-radius: 16px;

    max-width: 90%;

    line-height: 1.5;

    font-size: 14px;
}

.jarvis {
    background: rgba(8, 40, 60, .8);

    border: 1px solid
        rgba(0, 234, 255, .2);
}

.user {
    margin-left: auto;

    background: rgba(0, 130, 170, .3);

    border: 1px solid
        rgba(0, 234, 255, .2);
}


/* INPUT */

.input-area {
    display: flex;
    gap: 8px;

    background: rgba(3, 15, 25, .9);

    border: 1px solid
        rgba(0, 234, 255, .25);

    padding: 7px;

    border-radius: 17px;
}

input {
    flex: 1;

    background: transparent;

    border: none;

    outline: none;

    color: white;

    font-size: 15px;

    padding: 10px;
}

input::placeholder {
    color: #688392;
}

.send {
    width: 45px;
    height: 45px;

    border: none;

    border-radius: 13px;

    background: #00bfd8;

    font-size: 20px;

    cursor: pointer;
}


/* MICROPHONE */

.mic {
    width: 65px;
    height: 65px;

    margin: 15px auto;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #145e73,
            #062d3b
        );

    border: 2px solid
        rgba(0,234,255,.5);

    color: white;

    font-size: 25px;

    box-shadow:
        0 0 25px rgba(0,234,255,.3);
}

.mic:active {
    transform: scale(.9);
}


/* QUICK COMMANDS */

.title {
    color: #688696;

    font-size: 11px;

    margin-bottom: 8px;

    letter-spacing: 1px;
}

.quick {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 8px;
}

.quick button {
    padding: 11px 4px;

    background:
        rgba(8,35,50,.8);

    border:
        1px solid
        rgba(0,234,255,.15);

    border-radius: 12px;

    color: #b9eff8;

    font-size: 11px;
}

.quick button:active {
    background:
        rgba(0,180,220,.3);
}

.footer {
    text-align: center;

    color: #466170;

    font-size: 10px;

    margin-top: 15px;
}

</style>
</head>


<body>

<div class="app">

    <div class="header">

        <div class="logo">
            JARVIS
        </div>

        <div class="online">
            <span class="dot"></span>
            ONLINE
        </div>

    </div>


    <div class="core-area">

        <div class="ring"></div>

        <div class="core"></div>

    </div>


    <div
        class="chat"
        id="chat"
    >

        <div class="message jarvis">

            Hello. I am JARVIS.
            Your personal AI assistant.
            How may I help you?

        </div>

    </div>


    <div class="input-area">

        <input
            id="input"
            placeholder="Ask JARVIS anything..."
            autocomplete="off"
        >

        <button
            class="send"
            onclick="sendMessage()"
        >
            ➤
        </button>

    </div>


    <button
        class="mic"
        onclick="startVoice()"
    >
        🎙️
    </button>


    <div class="title">
        QUICK COMMANDS
    </div>


    <div class="quick">

        <button onclick="command('open YouTube')">
            ▶️ YouTube
        </button>

        <button onclick="command('open Google')">
            🔎 Google
        </button>

        <button onclick="command('open Amazon')">
            🛒 Amazon
        </button>

        <button onclick="command('open Flipkart')">
            🛍️ Flipkart
        </button>

        <button onclick="command('open Instagram')">
            📸 Instagram
        </button>

        <button onclick="command('open WhatsApp')">
            💬 WhatsApp
        </button>

        <button onclick="command('open Spotify')">
            🎵 Spotify
        </button>

        <button onclick="command('open Gmail')">
            📧 Gmail
        </button>

        <button onclick="command('open Maps')">
            🗺️ Maps
        </button>

        <button onclick="command('open GitHub')">
            💻 GitHub
        </button>

        <button onclick="command('open LinkedIn')">
            💼 LinkedIn
        </button>

        <button onclick="command('open Wikipedia')">
            📚 Wikipedia
        </button>

    </div>


    <div class="footer">
        JARVIS AI • HTML / CSS / JavaScript
    </div>

</div>


<script>


/* =====================================================
   OPENAI API KEY
===================================================== */

/*
   LOCAL TESTING ONLY.

   Replace the text inside the quotes with your key.

   Example:

   const OPENAI_API_KEY =
       "your-real-api-key-here";

*/

const OPENAI_API_KEY =
    "PASTE_YOUR_OPENAI_API_KEY_HERE";


/* =====================================================
   OPENAI MODEL
===================================================== */

const OPENAI_MODEL = "gpt-5.6";


/* =====================================================
   WEBSITE DATABASE
===================================================== */

const websites = {

    youtube:
        "https://www.youtube.com/",

    google:
        "https://www.google.com/",

    chrome:
        "https://www.google.com/chrome/",

    amazon:
        "https://www.amazon.in/",

    flipkart:
        "https://www.flipkart.com/",

    instagram:
        "https://www.instagram.com/",

    whatsapp:
        "https://web.whatsapp.com/",

    facebook:
        "https://www.facebook.com/",

    twitter:
        "https://x.com/",

    spotify:
        "https://open.spotify.com/",

    gmail:
        "https://mail.google.com/",

    maps:
        "https://maps.google.com/",

    github:
        "https://github.com/",

    linkedin:
        "https://www.linkedin.com/",

    wikipedia:
        "https://www.wikipedia.org/",

    reddit:
        "https://www.reddit.com/",

    netflix:
        "https://www.netflix.com/",

    myntra:
        "https://www.myntra.com/",

    meesho:
        "https://www.meesho.com/",

    news:
        "https://news.google.com/",

    chatgpt:
        "https://chatgpt.com/",

    drive:
        "https://drive.google.com/",

    translate:
        "https://translate.google.com/"

};


/* =====================================================
   CHAT
===================================================== */

function addMessage(text, type) {

    const chat =
        document.getElementById("chat");

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent = text;

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


/* =====================================================
   TEXT TO SPEECH
===================================================== */

function speak(text) {

    if (!("speechSynthesis" in window))
        return;

    speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.lang = "en-IN";

    speech.rate = 0.95;

    speech.pitch = 1;

    speech.volume = 1;

    speechSynthesis.speak(speech);
}


/* =====================================================
   JARVIS RESPONSE
===================================================== */

function respond(text) {

    addMessage(
        text,
        "jarvis"
    );

    speak(text);
}


/* =====================================================
   VOICE RECOGNITION
===================================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "en-IN";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    recognition.onresult =
        function(event) {

            const text =
                event
                .results[0][0]
                .transcript;

            document
                .getElementById("input")
                .value = text;

            command(text);
        };


    recognition.onerror =
        function() {

            respond(
                "Sorry, I couldn't hear you."
            );

        };

}


function startVoice() {

    if (!recognition) {

        respond(
            "Voice recognition is not supported by this browser. Please try Chrome on Android."
        );

        return;
    }

    try {

        recognition.start();

    } catch(error) {

        console.log(error);

    }

}


/* =====================================================
   TEXT INPUT
===================================================== */

function sendMessage() {

    const input =
        document.getElementById("input");

    const text =
        input.value.trim();

    if (!text)
        return;

    input.value = "";

    command(text);
}


document
    .getElementById("input")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                sendMessage();

            }

        }
    );


/* =====================================================
   COMMAND ENGINE
===================================================== */

function command(text) {

    addMessage(
        text,
        "user"
    );

    const lower =
        text.toLowerCase().trim();


    /* WEBSITE COMMANDS */

    for (
        const site in websites
    ) {

        if (

            lower === site ||

            lower.includes(
                "open " + site
            ) ||

            lower.includes(
                "launch " + site
            ) ||

            lower.includes(
                "go to " + site
            )

        ) {

            respond(
                "Opening " + site + "."
            );

            setTimeout(
                function() {

                    window.location.href =
                        websites[site];

                },
                500
            );

            return;
        }

    }


    /* YOUTUBE SEARCH */

    if (

        lower.startsWith("play ") ||

        lower.includes(
            "search youtube for"
        )

    ) {

        let query =
            lower
            .replace(
                "search youtube for",
                ""
            )
            .replace(
                "play",
                ""
            )
            .trim();


        if (query) {

            respond(
                "Searching YouTube for " +
                query
            );

            setTimeout(
                function() {

                    window.location.href =
                        "https://www.youtube.com/results?search_query=" +
                        encodeURIComponent(query);

                },
                500
            );

            return;
        }

    }


    /* GOOGLE SEARCH */

    if (

        lower.startsWith(
            "search "
        ) ||

        lower.startsWith(
            "google "
        )

    ) {

        let query =
            lower
            .replace(
                "search",
                ""
            )
            .replace(
                "google",
                ""
            )
            .trim();


        respond(
            "Searching Google for " +
            query
        );


        setTimeout(
            function() {

                window.location.href =
                    "https://www.google.com/search?q=" +
                    encodeURIComponent(query);

            },
            500
        );

        return;

    }


    /* TIME */

    if (

        lower.includes(
            "what time"
        ) ||

        lower === "time"

    ) {

        const time =
            new Date()
            .toLocaleTimeString(
                "en-IN",
                {
                    hour: "numeric",
                    minute: "2-digit"
                }
            );


        respond(
            "The time is " +
            time
        );

        return;

    }


    /* DATE */

    if (

        lower.includes(
            "what date"
        ) ||

        lower.includes(
            "today's date"
        )

    ) {

        const date =
            new Date()
            .toLocaleDateString(
                "en-IN",
                {
                    weekday: "long",
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                }
            );


        respond(
            "Today is " +
            date
        );

        return;

    }


    /* CAMERA */

    if (

        lower.includes(
            "open camera"
        )

    ) {

        respond(
            "Trying to open the camera."
        );

        window.location.href =
            "intent:#Intent;action=android.media.action.IMAGE_CAPTURE;end";

        return;

    }


    /* PHONE */

    if (

        lower.includes(
            "open phone"
        )

    ) {

        respond(
            "Trying to open the phone application."
        );

        window.location.href =
            "tel:";

        return;

    }


    /* OTHERWISE ASK OPENAI */

    askOpenAI(text);

}


/* =====================================================
   OPENAI API
===================================================== */

async function askOpenAI(question) {

    if (

        !OPENAI_API_KEY ||

        OPENAI_API_KEY ===
"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"

    ) {

        respond(
            "Your OpenAI API key has not been added yet."
        );

        return;

    }


    respond(
        "Thinking..."
    );


    try {

        const response =
            await fetch(
                "https://api.openai.com/v1/responses",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            OPENAI_API_KEY

                    },

                    body:
                        JSON.stringify({

                            model:
                                OPENAI_MODEL,

                            instructions:
                                `
You are JARVIS, a helpful,
friendly personal AI assistant.

Answer clearly and concisely.

The user may speak to you
using voice.

Do not claim that you can
control the phone unless the
browser actually gives you
that ability.

You can explain programming,
science, mathematics, general
knowledge, and other topics.
`,

                            input:
                                question

                        })

                }
            );


        if (!response.ok) {

            const error =
                await response.text();

            console.error(error);

            respond(
                "I couldn't connect to the OpenAI API."
            );

            return;
        }


        const data =
            await response.json();


        let answer = "";


        /*
           Responses API output can contain
           multiple output items.
        */

        if (data.output) {

            for (
                const item
                of data.output
            ) {

                if (
                    item.type ===
                    "message"
                ) {

                    if (
                        item.content
                    ) {

                        for (
                            const part
                            of item.content
                        ) {

                            if (
                                part.type ===
                                "output_text"
                            ) {

                                answer +=
                                    part.text;

                            }

                        }

                    }

                }

            }

        }


        if (!answer) {

            answer =
                "I received a response, but I couldn't read it.";

        }


        /*
           Replace "Thinking..."
        */

        const messages =
            document
            .getElementById("chat")
            .querySelectorAll(
                ".jarvis"
            );

        if (messages.length) {

            const last =
                messages[
                    messages.length - 1
                ];

            if (
                last.textContent ===
                "Thinking..."
            ) {

                last.textContent =
                    answer;

            } else {

                addMessage(
                    answer,
                    "jarvis"
                );

            }

        } else {

            addMessage(
                answer,
                "jarvis"
            );

        }


        speak(answer);


    } catch(error) {

        console.error(error);

        respond(
            "There was a connection error while contacting the AI."
        );

    }

}

</script>

</body>
</html>
